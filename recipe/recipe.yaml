context:
  version: "1.1.0"

package:
  name: libgbm
  version: ${{ version }}

source:
  url: https://github.com/glfs-book/libgbm/archive/refs/tags/${{ version }}.tar.gz
  sha256: a6555b2739a3f75c4c1d278be3ef5a8d2612d44105234091ed60a5e3634b8a2e

build:
  number: 0
  skip:
    - not linux

requirements:
  build:
    - ${{ compiler('c') }}
    - ${{ stdlib("c") }}
    - ${{ compiler('cxx') }}
    - meson
    - pkgconf
  host:
    - libdrm
  run_exports:
    - ${{ pin_subpackage('libgbm', upper_bound='x.x') }}

tests:
  - package_contents:
      include:
        - gbm.h
      lib:
        - gbm

about:
  homepage: https://github.com/glfs-book/libgbm
  license: MIT
  license_file: LICENSE
  summary: Generic Buffer Management backend loader

extra:
  recipe-maintainers:
    - jschueller
